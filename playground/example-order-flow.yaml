# Example: createOrder — 3 stages mixing sequential and parallel calls.
# Uses the A2D mock REST APIs (https://www.a2d-ai.com) — no real credentials needed.
#
# Pipeline latency (approx):
#   Stage 1 (sequential)  getToken                        ~200ms
#   Stage 2 (parallel)    fetchCustomer + checkInventory  ~200ms  ← fired together
#   Stage 3 (sequential)  createOrder                     ~200ms
#                                                         ──────
#   Total                                                 ~600ms (vs ~800ms all-sequential)
#
# Input:  { "customerId": "CUST-001", "productSku": "SKU-7842", "quantity": 5 }
# Output: raw composite with keys: getToken (***), fetchCustomer, checkInventory, createOrder
#
# Credential model
# ─────────────────
# - getToken:       no auth — client credentials in body; token masked in output
# - fetchCustomer:  bearerToken — ${steps.getToken} resolved from Stage 1
# - checkInventory: apiKeyHeader — static key in apiKey field
# - createOrder:    basicAuth — username/password fields
#
# NOTE: inputTransform / outputTransform are omitted intentionally.
# DataWeave compilation at policy init is not supported on Flex Gateway 1.9.x
# (limitation L-3). Use the raw composite output directly from steps.*

toolName: createOrder
toolDescription: >
  Creates an order by first obtaining a bearer token from the auth service,
  then fetching customer profile and inventory data in parallel, and finally
  submitting the order. Returns orderId and confirmed status.

toolInputSchema: |
  {
    "type": "object",
    "properties": {
      "customerId": { "type": "string", "description": "Customer ID, e.g. CUST-001" },
      "productSku":  { "type": "string", "description": "Product SKU, e.g. SKU-7842" },
      "quantity":    { "type": "integer", "minimum": 1 }
    },
    "required": ["customerId", "productSku", "quantity"]
  }

mcpEndpoint: /mcp
strictMode: true
perRequestTimeoutMs: 15000
pipelineTimeoutMs: 60000

stages:

  # ── Stage 1: Auth (sequential, no-auth API) ──────────────────────────────────
  - calls:
      - name: getToken
        endpoint: https://www.a2d-ai.com
        method: POST
        path: /api/platform/2992ab1d-933d-47db-b98a-50e3723c31e7/api/auth/token
        authType: none
        bodyTemplate: '{"client_id":"mcp-composer-client","client_secret":"demo-secret"}'
        stopOnError: true
        outputExtract: access_token
        maskInOutput: true   # token replaced with "***" in MCP response; flows internally via ${steps.getToken}

  # ── Stage 2: Customer + Inventory in parallel ─────────────────────────────────
  - parallel: true
    calls:
      - name: fetchCustomer
        endpoint: https://www.a2d-ai.com
        method: GET
        path: /api/platform/6bb6994c-9dcf-41f6-a314-89e3af12e0d1/api/customers/customers/${args.customerId}
        authType: bearerToken
        token: "${steps.getToken}"   # step-derived from Stage 1
        stopOnError: true

      - name: checkInventory
        endpoint: https://www.a2d-ai.com
        method: GET
        path: /api/platform/aed7c7a0-88c5-4700-bc86-c302ae789bb0/api/inventory/products/${args.productSku}
        authType: apiKeyHeader
        headerName: X-API-Key
        apiKey: inv-api-key-mcp-composer-2026
        stopOnError: false   # out-of-stock is a warning, not a fatal error

  # ── Stage 3: Create order (sequential, Basic auth) ────────────────────────────
  - calls:
      - name: createOrder
        endpoint: https://www.a2d-ai.com
        method: POST
        path: /api/platform/45f33fc3-a0d8-433b-895f-c0a578060c97/api/orders/orders
        authType: basicAuth
        username: orders-svc
        password: "s3cr3t-mcp-2026"
        bodyTemplate: '{"customerId":"${args.customerId}","sku":"${args.productSku}","quantity":${args.quantity}}'
        stopOnError: true
