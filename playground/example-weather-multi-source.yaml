# Example: getWeatherMultiSource — weather from 3 independent sources simultaneously.
# No API key required. All services are free and public.
#
# Pipeline latency (approx):
#   Stage 1  geocode (sequential)                              ~100ms
#   Stage 2  weather + airQuality + wttrWeather (parallel)     ~200ms
#                                                              ──────
#   Total                                                      ~300ms (vs ~600ms sequential)
#
# Input:  { "city": "Berlin" }
# Output: raw composite object with keys: geocode, weather, airQuality, wttrWeather
#
# NOTE: inputTransform / outputTransform are omitted intentionally.
# DataWeave compilation at policy init is not supported on Flex Gateway 1.9.x
# (limitation L-3). Use the raw composite output directly from steps.*

toolName: getWeatherMultiSource
toolDescription: >
  Returns current weather for a city from 3 independent sources simultaneously:
  Open-Meteo (temperature, wind, humidity), Open-Meteo Air Quality (AQI, PM10,
  PM2.5), and wttr.in (second weather source with description). No API key needed.

toolInputSchema: |
  {
    "type": "object",
    "properties": {
      "city": {
        "type": "string",
        "description": "City name, e.g. Berlin, Istanbul, Tokyo"
      }
    },
    "required": ["city"]
  }

mcpEndpoint: /mcp
strictMode: true
perRequestTimeoutMs: 10000
pipelineTimeoutMs: 60000

stages:

  # ── Stage 1: Geocoding (sequential) ─────────────────────────────────────────
  - calls:
      - name: geocode
        endpoint: https://geocoding-api.open-meteo.com
        method: GET
        path: /v1/search?name=${args.city}&count=1&language=en&format=json
        authType: none
        stopOnError: true
        outputExtract: results.0

  # ── Stage 2: 3 weather sources in parallel ───────────────────────────────────
  - parallel: true
    calls:

      # Source 1: Open-Meteo — temperature, wind, humidity
      - name: weather
        endpoint: https://api.open-meteo.com
        method: GET
        path: /v1/forecast?latitude=${steps.geocode.latitude}&longitude=${steps.geocode.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto
        authType: none
        stopOnError: true
        outputExtract: current

      # Source 2: Open-Meteo Air Quality — AQI, PM10, PM2.5
      - name: airQuality
        endpoint: https://air-quality-api.open-meteo.com
        method: GET
        path: /v1/air-quality?latitude=${steps.geocode.latitude}&longitude=${steps.geocode.longitude}&current=us_aqi,pm10,pm2_5
        authType: none
        stopOnError: false   # graceful degradation if AQ API is down
        outputExtract: current

      # Source 3: wttr.in — independent weather source with text description
      - name: wttrWeather
        endpoint: https://wttr.in
        method: GET
        path: /${args.city}?format=j1
        authType: none
        stopOnError: false   # graceful degradation if wttr.in is down
