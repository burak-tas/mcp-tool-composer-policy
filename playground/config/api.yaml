---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ingress-http
spec:
  address: http://0.0.0.0:8081
  services:
    upstream:
      address: https://www.a2d-ai.com
      routes:
        - config:
            destinationPath: /
  policies:
    - policyRef:
        name: mcp-tool-composer-policy-v0-1-impl
        namespace: default
      config:
        mcpEndpoint: "/mcp"
        strictMode: true
        perRequestTimeoutMs: 15000

        toolName: createOrder
        toolDescription: >
          Creates an order by first obtaining a bearer token from the auth
          service, then fetching customer profile and inventory data in
          parallel, and finally submitting the order. Returns orderId and
          confirmed status.
        toolInputSchema: |
          {
            "type": "object",
            "properties": {
              "customerId": { "type": "string", "description": "Customer ID, e.g. CUST-001" },
              "productSku":  { "type": "string", "description": "Product SKU, e.g. SKU-7842" },
              "quantity":    { "type": "integer", "minimum": 1 }
            },
            "required": ["customerId", "productSku", "quantity"]
          }

        # inputTransform and outputTransform omitted — identity pass-through (no DW eval)


        stages:

          # ── Stage 1: Auth (sequential, no-auth API) ──────────────────────────
          - calls:
              - name: getToken
                endpoint: https://www.a2d-ai.com
                method: POST
                path: /api/platform/2992ab1d-933d-47db-b98a-50e3723c31e7/api/auth/token
                authType: none
                bodyTemplate: '{"client_id":"mcp-composer-client","client_secret":"demo-secret"}'
                stopOnError: true
                outputExtract: access_token
                maskInOutput: true

          # ── Stage 2: Customer + Inventory in parallel ─────────────────────────
          - parallel: true
            calls:
              - name: fetchCustomer
                endpoint: https://www.a2d-ai.com
                method: GET
                path: /api/platform/6bb6994c-9dcf-41f6-a314-89e3af12e0d1/api/customers/customers/${args.customerId}
                authType: bearerToken
                token: "${steps.getToken}"
                stopOnError: true

              - name: checkInventory
                endpoint: https://www.a2d-ai.com
                method: GET
                path: /api/platform/aed7c7a0-88c5-4700-bc86-c302ae789bb0/api/inventory/products/${args.productSku}
                authType: apiKeyHeader
                headerName: X-API-Key
                apiKey: inv-api-key-mcp-composer-2026
                stopOnError: false

          # ── Stage 3: Create order (sequential, Basic auth) ────────────────────
          - calls:
              - name: createOrder
                endpoint: https://www.a2d-ai.com
                method: POST
                path: /api/platform/45f33fc3-a0d8-433b-895f-c0a578060c97/api/orders/orders
                authType: basicAuth
                username: orders-svc
                password: "s3cr3t-mcp-2026"
                bodyTemplate: '{"customerId":"${args.customerId}","sku":"${args.productSku}","quantity":${args.quantity}}'
                stopOnError: true
