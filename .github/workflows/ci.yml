name: CI

# Gates every push and pull request against the two things that actually
# protect the policy's behaviour:
#   1. the pdk-unit test suite (entrypoint + helper tests) must pass, and
#   2. the policy must still compile to the wasm32-wasip1 target the gateway
#      loads (the same `cargo build` step `make build` runs before packaging).
#
# `cargo fmt` / `cargo clippy` run as advisory steps (continue-on-error) so
# the signal is visible in the checks tab without blocking on pre-existing
# formatting drift; promote them to hard gates once the tree is clean.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test + wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # --- Hard gates -----------------------------------------------------
      - name: Unit tests (pdk-unit entrypoint + helper tests)
        run: cargo test --lib --all-features -- --nocapture

      - name: Build wasm32-wasip1 (release)
        run: cargo build --release --target wasm32-wasip1

      # --- Advisory checks (do not fail the build yet) --------------------
      - name: rustfmt (advisory)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: clippy (advisory)
        run: cargo clippy --all-targets --all-features
        continue-on-error: true
